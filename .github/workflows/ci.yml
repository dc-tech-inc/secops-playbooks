name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - run: pip install -r requirements-lint.txt
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: yamllint
        run: yamllint .
      - name: Workflow and Dependabot schemas
        run: |
          check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
          check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml github-advanced-security/dependabot/dependabot.template.yml
      - name: shellcheck
        run: shellcheck scripts/*.sh github-advanced-security/*.sh
      - name: Network policy invariants
        run: python network-architecture/policy_check.py
      - name: Markdown links, runbook structure, no personal data
        run: python runbooks/runbook_lint.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: pytest (network policy, detection, secret patterns, pcap helpers, runbooks)
        run: pytest --cov --cov-report=term --cov-report=xml -W error::ResourceWarning

  powershell:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pester and PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ./powershell -Recurse -Severity Warning, Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: Pester
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './powershell/tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version, sha256 verified)
        run: scripts/install-gitleaks.sh .bin
      - name: Scan full git history
        run: .bin/gitleaks detect --source . --no-banner --redact

  # ---- Heavier jobs: pull requests and manual runs only (private-repo Actions minutes) ----

  notebooks:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Cache public PCAP samples
        uses: actions/cache@v4
        with:
          path: pcap-notebooks/data
          key: pcap-samples-${{ hashFiles('pcap-notebooks/samples.json') }}
      - name: Fetch and sha256-verify samples
        run: python pcap-notebooks/fetch_samples.py
      - name: Execute notebooks (nbmake)
        run: pytest --nbmake pcap-notebooks/notebooks

  terraform:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azure-as-code/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: test (mock provider)
        run: terraform test

  tflint:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: tflint --init
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --chdir azure-as-code/terraform --config "$GITHUB_WORKSPACE/.tflint.hcl"

  bicep:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep (pinned version, sha256 verified)
        run: scripts/install-bicep.sh .bin
      - name: Build and lint (warnings fail)
        run: scripts/validate-bicep.sh .bin/bicep azure-as-code/bicep/*.bicep
      - name: The gate rejects an invalid template
        run: |
          if scripts/validate-bicep.sh .bin/bicep azure-as-code/bicep/tests/invalid-property.bicep; then
            echo "::error::invalid-property.bicep was accepted"
            exit 1
          fi

  checkov:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scan.txt
      - run: pip install -r requirements-scan.txt
      - run: checkov --config-file .checkov.yaml
