title: Certutil Used to Download a File
id: 3b12f770-2aef-45ff-8379-3d60b7841a58
status: test
description: |
  Detects certutil.exe with -urlcache / -split / -f and a URL, a living-off-the-land way to
  fetch files that bypasses a browser. Legitimate use exists but is rare on workstations.
references:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/certutil
author: DC TECH INC
date: 2026-10-22
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\certutil.exe'
  selection_cli:
    CommandLine|contains: 'urlcache'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
  condition: all of selection_*
falsepositives:
  - PKI administrators refreshing CRLs by hand
level: high
